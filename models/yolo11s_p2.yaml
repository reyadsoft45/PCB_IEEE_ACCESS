# ============================================================
# YOLO11s + P2
# PCB small-defect detection model
#
# Detection outputs:
# P2 = stride 4
# P3 = stride 8
# P4 = stride 16
# P5 = stride 32
# ============================================================

nc: 6

# Explicit YOLO11-s scaling
depth_multiple: 0.50
width_multiple: 0.50

# ============================================================
# BACKBONE
# ============================================================

backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]]          # 0 - P1/2

  - [-1, 1, Conv, [128, 3, 2]]         # 1 - P2/4

  - [-1, 2, C3k2, [256, False, 0.25]]  # 2 - P2 features

  - [-1, 1, Conv, [256, 3, 2]]         # 3 - P3/8

  - [-1, 2, C3k2, [512, False, 0.25]]  # 4 - P3 features

  - [-1, 1, Conv, [512, 3, 2]]         # 5 - P4/16

  - [-1, 2, C3k2, [512, True]]         # 6 - P4 features

  - [-1, 1, Conv, [1024, 3, 2]]        # 7 - P5/32

  - [-1, 2, C3k2, [1024, True]]        # 8

  - [-1, 1, SPPF, [1024, 5]]           # 9

  - [-1, 2, C2PSA, [1024]]             # 10


# ============================================================
# STANDARD YOLO11 PAN/FPN HEAD
# ============================================================

head:

  # ---------------- P5 -> P4 ----------------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11

  - [[-1, 6], 1, Concat, [1]]                  # 12

  - [-1, 2, C3k2, [512, False]]                # 13 - P4


  # ---------------- P4 -> P3 ----------------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14

  - [[-1, 4], 1, Concat, [1]]                  # 15

  - [-1, 2, C3k2, [256, False]]                # 16 - P3/8


  # ---------------- P3 -> P4 ----------------

  - [-1, 1, Conv, [256, 3, 2]]                 # 17

  - [[-1, 13], 1, Concat, [1]]                 # 18

  - [-1, 2, C3k2, [512, False]]                # 19 - P4/16


  # ---------------- P4 -> P5 ----------------

  - [-1, 1, Conv, [512, 3, 2]]                 # 20

  - [[-1, 10], 1, Concat, [1]]                 # 21

  - [-1, 2, C3k2, [1024, True]]                # 22 - P5/32


  # ==========================================================
  # NEW P2 SMALL-OBJECT BRANCH
  # ==========================================================

  # Refined P3 -> high-resolution P2
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23

  # Combine refined P3 information with backbone P2
  - [[-1, 2], 1, Concat, [1]]                  # 24

  - [-1, 2, C3k2, [128, False]]                # 25 - P2/4


  # ==========================================================
  # DETECTION: P2 + P3 + P4 + P5
  # ==========================================================

  - [[25, 16, 19, 22], 1, Detect, [nc]]        # 26